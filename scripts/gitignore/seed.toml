# seed.toml — Sovereign Suite gitignore seed config
# ==================================================
# The editable surface for the gitignore seeder. Tune these categories without
# touching code. Each category renders, in order, into the managed block written
# to the target workspace's .gitignore. Patterns use standard gitignore syntax.
#
# A category with `scan_secrets = true` is ALSO used for the detect-and-warn pass:
# its patterns are intersected with `git ls-files` to find secrets that are
# ALREADY TRACKED. The seeder warns and recommends /gitclean for those — it never
# scrubs history itself.
#
# Category render order is the order the [categories.*] tables appear below.

[categories.suite]
title = "Suite-generated / ingestion-banned (never tracked)"
# [CORRECTED 2026-07-07, Sovereign Redesign Cluster Stage 6] Was bare ".history/",
# which also silently blocked .history/archive/ -- nodelete.md Pillar 6 explicitly
# designed that subdirectory as NOT ingestion-banned (an Append-Only Ledger meant
# to be a durable, human-readable, git-trackable record), distinct from
# .history/quarantine/ (the actual ingestion-banned Quarantined Change Ledger).
# Narrowed to the specific subdirectory this category's own title describes.
patterns = [
    ".history/quarantine/",
    "quarantine/",
    ".workflow_state/",
    "deprecated/",
    ".doorway/",
]

[categories.security]
title = "Security — secrets & credentials (NEVER commit)"
scan_secrets = true
patterns = [
    ".env",
    ".env.*",
    "secrets/",
    "*.key",
    "*.pem",
    "id_rsa*",
    "*.p12",
    "*.pfx",
    "credentials*.json",
    "service-account*.json",
    ".aws/",
]

[categories.noise]
title = "Common noise (build artifacts, caches, editor cruft)"
patterns = [
    "__pycache__/",
    "*.pyc",
    ".venv/",
    "node_modules/",
    # [CORRECTED 2026-07-07] "dist/"/"build/" (unanchored) match at any depth,
    # silently ignoring this suite's own scripts/build/ engine package (the
    # /execute-build Build Evidence Engine, implementation-plan.md Phase 4.2)
    # -- discovered live when it failed to appear in `git status`. Anchored to
    # repo root: this workspace is a workflow library, not a bundled app, so
    # there is no legitimate nested dist/build/ dir this repo itself produces.
    "/dist/",
    "/build/",
    ".DS_Store",
    "*.log",
    ".idea/",
    ".vscode/",
]
